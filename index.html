<style>
/* цвета интерфейса меняются вместе с миром (см. hud в LV) */
:root{--bg:rgba(60,30,110,.85);--t:#fff;--b:#ff7ac6;--bl:#ff9ed8;--bt:#3a0f45;--sh:#b3427f;--p1:rgba(104,52,196,.96);--p2:rgba(34,18,92,.97);--edge:#ffb6e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;background:linear-gradient(180deg,#ffffff1f,#ffffff0d);border:1px solid #ffffff26;border-radius:16px;padding:9px 10px}

/* заставка уровня, меню миров, вспышка молнии, затемнение при смене мира */

@keyframes bn{0%{opacity:0;transform:translateY(14px) scale(.96)}14%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('hint').textContent='Не загрузился three.js — нужен интернет (cdnjs.cloudflare.com).';return}
const PI=Math.PI,H=PI/2,V3=THREE.Vector3,MAXL=3,KEY='cc3v2';
const FREE_SELECT=true; // true — любой мир можно открыть из меню; false — миры открываются по порядку прохождения

// ================= сохранение и прокачка =================
let S={cash:0,lvl:1,max:1,cap:0,spd:0,rad:0,pow:0,val:0,sta:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)))}catch(e){}
S.lvl=Math.min(MAXL,Math.max(1,S.lvl|0));S.max=Math.min(MAXL,Math.max(S.lvl,S.max|0));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const resetRun=()=>{S.cash=0;S.cap=S.spd=S.rad=S.pow=S.val=S.sta=0}; // в каждом новом мире всё начинается с нуля
const staV=()=>100+S.sta*25,capV=()=>5+S.cap*3,spdV=()=>12+S.spd*1.8,radV=()=>5+S.rad*.9,powV=()=>1+S.pow*.55,valV=()=>1+S.val*.5;
const UP=[['cap','🎒 Трюм',25,()=>'вмест. '+capV()],['spd','🚀 Мотор',32,()=>'скор. '+spdV().toFixed(0)],['rad','🌀 Радиус',35,()=>'радиус '+radV().toFixed(1)],['pow','💪 Мощность',40,()=>'сила '+powV().toFixed(1)],['val','🍭 Цена',45,()=>'x'+valV().toFixed(1)],['sta','⚡ Рывок',30,()=>'запас '+staV()]];
const cost=u=>Math.floor(u[2]*Math.pow(1.5,S[u[0]]));
const IC={cap:['#ffb36b','#ff7a45'],spd:['#6bd0ff','#3a7bff'],rad:['#b78bff','#7a4cff'],pow:['#ff8b8b','#ff4a6a'],val:['#ffe36e','#ffb02e'],sta:['#7dffb0','#2ed17a']};
const DESC={cap:'Больше звёзд в мешке',spd:'Кит летает быстрее',rad:'Шире зона всасывания',pow:'Берёт крепкие облака',val:'Больше 🍬 за звёзду',sta:'Рывок длится дольше'};
$('shop').innerHTML='<h3>🛠 Станция прокачки <small id="scash"></small></h3>';
UP.forEach(u=>{const r=document.createElement('div');r.className='row';r.innerHTML='<div class="ic"></div><div class="tx"><b></b><span></span><div class="lv"></div><i></i></div><button class="buy"></button>';r.style.setProperty('--c1',IC[u[0]][0]);r.style.setProperty('--c2',IC[u[0]][1]);u.r=r;u.b=r.querySelector('.buy');u.b.onclick=()=>{const c=cost(u);if(S.cash>=c){S.cash-=c;S[u[0]]++;save();if(u[0]=='rad')buildSpin();ui()}};$('shop').appendChild(r)});
const TB=[1,2,3.3,5]; // базовая «крепость» облаков четырёх тиров

// ================= процедурные модели =================
function P3(g,c,o){o=o||{};const m=new THREE.Matrix4().compose(new V3(o.x||0,o.y||0,o.z||0),new THREE.Quaternion().setFromEuler(new THREE.Euler(o.rx||0,o.ry||0,o.rz||0)),new V3(o.sx||1,o.sy||1,o.sz||1));g=g.index?g.toNonIndexed():g.clone();g.applyMatrix4(m);return{g,c:new THREE.Color(c)}}
function merge(ps){let n=0;ps.forEach(p=>n+=p.g.attributes.position.count);const pos=new Float32Array(n*3),col=new Float32Array(n*3);let o=0;
 ps.forEach(p=>{const a=p.g.attributes.position;pos.set(a.array,o*3);for(let i=0;i<a.count;i++){col[(o+i)*3]=p.c.r;col[(o+i)*3+1]=p.c.g;col[(o+i)*3+2]=p.c.b}o+=a.count});
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();return g}
const EX=(s,d,b)=>new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:!!b,bevelThickness:.05,bevelSize:.05,bevelSegments:1,curveSegments:8});
const LA=(pts,n)=>new THREE.LatheGeometry(pts.map(a=>new THREE.Vector2(a[0],a[1])),n||14);
function shp(f){const s=new THREE.Shape();f(s);return s}
function starShape(n,ro,ri){return shp(s=>{for(let i=0;i<n*2;i++){const a=i*PI/n+PI/2,r=i%2?ri:ro;i?s.lineTo(Math.cos(a)*r,Math.sin(a)*r):s.moveTo(Math.cos(a)*r,Math.sin(a)*r)}s.closePath()})}
const MAT=new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true,side:2});
const mesh=(g,m)=>new THREE.Mesh(g,m||MAT);
const KEEP=new Set([MAT]); // общие ресурсы, которые нельзя уничтожать при смене мира
function noisy(g,f){const a=g.attributes.position;for(let k=0;k<a.count;k++){const r=f(a.getX(k),a.getY(k),a.getZ(k));a.setXYZ(k,r[0],r[1],r[2])}return g}
function blobGeo(seed,i,det,amp,fq,flat,fu){return noisy(new THREE.IcosahedronGeometry(1,det),(x,y,z)=>{const d=1+amp*Math.sin(x*fq+seed+i)*Math.cos(z*fq*1.1+seed*1.7)+amp*.5*Math.sin(y*fq*1.3+i);return[x*d,y<0?y*d*flat:y*d*(fu==null?1:fu),z*d]})}
const rimShape=(seed,r,amp,k)=>shp(s=>{for(let i=0;i<=90;i++){const a=i/90*PI*2,rr=r+amp*Math.abs(Math.sin(a*k+seed));i?s.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):s.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}});
const boltShape=()=>shp(s=>{s.moveTo(.3,0);s.lineTo(-.4,-.9);s.lineTo(-.05,-.9);s.lineTo(-.4,-1.9);s.lineTo(.5,-.7);s.lineTo(.1,-.7);s.closePath()});
const crystal=(w,h)=>LA([[.01,0],[w,h*.2],[w,h*.75],[.01,h]],6);                       // гранёный кристалл
const gum=(c,x,y,z,s)=>P3(LA([[.01,0],[.7,0],[.85,.3],[.6,.8],[.01,1]],8),c,{x,y,z,sx:s,sy:s,sz:s}); // мармеладка
// снежинка: 6 лучей с «веточками»
function flakeParts(r,c,o){o=o||{};const arm=shp(s=>{const p=[[0,-.08],[.5,-.06],[.72,-.3],[.78,-.25],[.62,-.03],[.95,-.03],[1,0],[.95,.03],[.62,.03],[.78,.25],[.72,.3],[.5,.06],[0,.08]];p.forEach((q,i)=>i?s.lineTo(q[0]*r,q[1]*r):s.moveTo(q[0]*r,q[1]*r));s.closePath()}),g=EX(arm,o.d||.16),out=[];for(let i=0;i<6;i++)out.push(P3(g,c,{x:o.x||0,y:o.y||0,z:o.z||0,rz:i*PI/3+(o.rz||0)}));return out}
// ёлочка со снежными ярусами
function pineParts(x,y,z,s,c1,c2){const o={x,y,z,sx:s,sy:s,sz:s};return[P3(LA([[.2,0],[.2,.9]],5),'#ffffff',o),P3(LA([[.01,.7],[1.3,.7],[.85,1.6],[.01,1.95]],8),c1,o),P3(LA([[.01,1.4],[1,1.4],[.62,2.25],[.01,2.6]],8),c2,o),P3(LA([[.01,2.1],[.68,2.1],[.01,3.4]],8),'#ffffff',o)]}

// ---- кит-пылесос (общий для всех миров) ----
function buildWhale(){const w=[];
 w.push(P3(LA([[.05,-4.2],[.4,-3.6],[.9,-2.5],[1.5,-1],[1.9,.5],[1.95,1.8],[1.5,3],[.8,3.9],[.05,4.25]],14),'#4fa3ff',{rz:-H,sz:.9}));
 w.push(P3(LA([[.05,-3.3],[.8,-2.2],[1.5,-.8],[1.9,.5],[1.9,1.6],[1.4,2.8],[.05,3.8]],12),'#ffffff',{rz:-H,sx:.95,sz:.86,y:-.2}));
 w.push(P3(EX(shp(s=>{s.moveTo(0,0);s.quadraticCurveTo(-.5,1.2,-2,2);s.quadraticCurveTo(-1.5,.8,-1.4,0);s.quadraticCurveTo(-1.5,-.8,-2,-2);s.quadraticCurveTo(-.5,-1.2,0,0)}),.25),'#ff7ac6',{x:-3.9,rx:H}));
 w.push(P3(EX(shp(s=>{s.moveTo(0,0);s.quadraticCurveTo(-.2,1.4,-1.4,1.7);s.quadraticCurveTo(-1,.7,-1.6,0)}),.18),'#2f7fd8',{x:-.3,y:1.7,z:-.09}));
 const fin=shp(s=>{s.moveTo(0,0);s.quadraticCurveTo(.3,1.2,1.8,1.7);s.quadraticCurveTo(1,.6,.9,0)});
 w.push(P3(EX(fin,.15),'#2f7fd8',{x:.2,y:-.9,z:1.3,rx:H,rz:-.4}));w.push(P3(EX(fin,.15),'#2f7fd8',{x:.2,y:-.9,z:-1.3,rx:-H,rz:.4}));
 const eye=shp(s=>s.absarc(0,0,.36,0,PI*2)),hl=shp(s=>s.absarc(.1,.1,.12,0,PI*2));
 [[1.02,1],[-1.17,1]].forEach(a=>{w.push(P3(EX(eye,.15),'#22143a',{x:2.9,y:.55,z:a[0]}));w.push(P3(EX(hl,.1),'#fff',{x:2.9,y:.55,z:a[0]+(a[1]>0?.15:-.1)}))});
 w.push(P3(LA([[.35,0],[.4,-.5],[1,-1.35]],12),'#ffd23f',{x:2.3,y:-1.6}));
 w.push(P3(LA([[.95,0],[.7,.4],[.3,.9],[.04,1.2]],10),'#ff4f9a',{x:1.1,y:1.75}));
 return merge(w)}
const blimp=new THREE.Group(),ship=new THREE.Group();ship.add(mesh(buildWhale()));ship.scale.setScalar(.75);blimp.add(ship);
const prop=new THREE.Group();{const bl=shp(s=>{s.moveTo(0,0);s.quadraticCurveTo(.5,.3,1.5,0);s.quadraticCurveTo(.5,-.3,0,0)}),b=EX(bl,.08);
 prop.add(mesh(merge([0,1,2].map(i=>P3(b,'#fff35c',{rz:i*2.094,rx:PI/2})))));prop.position.set(1.1,3.05,0);ship.add(prop)}

// ---- общие заготовки: звезда, камень островов, шестерни ----
const starG=EX(starShape(5,1,.5),.5,true);starG.translate(0,0,-.25);KEEP.add(starG);
const starM=[0,1,2,3].map(()=>{const m=new THREE.MeshLambertMaterial({color:'#fff',flatShading:true,emissive:'#fff',emissiveIntensity:.25});KEEP.add(m);return m});
const rgG=noisy(new THREE.IcosahedronGeometry(9,2),(x,y,z)=>{const n=1+.12*Math.sin(x*1.3+z*.9)*Math.cos(y*1.1+z*1.7);y=y>0?0:y*.62;return[x*n,y*n,z*n]});KEEP.add(rgG);
const door=shp(s=>{s.moveTo(-.6,0);s.lineTo(-.6,1);s.absarc(0,1,.6,PI,0,true);s.lineTo(.6,0)});
function gearShape(n,ro,ri,hole){const s=new THREE.Shape(),N=n*4;for(let i=0;i<N;i++){const a=i/N*PI*2,k=i%4,r=(k==1||k==2)?ro:ri;i?s.lineTo(Math.cos(a)*r,Math.sin(a)*r):s.moveTo(Math.cos(a)*r,Math.sin(a)*r)}s.closePath();const h=new THREE.Path();h.absarc(0,0,hole,0,PI*2,true);s.holes.push(h);return s}
// мягкая круглая точка для частиц
const dotTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.4,'rgba(255,255,255,.75)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();

// ================= сцена, свет, игрок =================
const sc=new THREE.Scene();sc.fog=new THREE.Fog('#e08fb8',100,340);
const cam=new THREE.PerspectiveCamera(55,1,.1,700);
const rd=new THREE.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(2,devicePixelRatio));document.body.prepend(rd.domElement);
function rs(){rd.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const hemi=new THREE.HemisphereLight('#c3b4ff','#5a3c9c',.75),sun=new THREE.DirectionalLight('#ffd9b8',.95),rim=new THREE.DirectionalLight('#ff9fb0',.5);sc.add(hemi,sun,rim);
sc.add(blimp);
const spin=new THREE.Group();sc.add(spin);let blades,disc;
function buildSpin(){while(spin.children.length)spin.remove(spin.children[0]);const r=radV();
 blades=new THREE.Group();const am=new THREE.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:.55,side:2});
 for(let i=0;i<3;i++){const q=new THREE.Mesh(new THREE.RingGeometry(r*.92,r,24,1,i*PI*2/3,PI*.45),am);q.rotation.x=-PI/2;blades.add(q);const w=new THREE.Mesh(new THREE.RingGeometry(r*.55,r*.6,24,1,i*PI*2/3+1,PI*.3),am);w.rotation.x=-PI/2;blades.add(w)}

const kn=e=>(e.code||'').replace(/^Key/,'').toLowerCase();addEventListener('keydown',e=>{keys[kn(e)]=1;if(/^(arrow|space)/.test(kn(e)))e.preventDefault()});addEventListener('keyup',e=>keys[kn(e)]=0);addEventListener('blur',()=>keys={});
const sb=$('sprint');sb.addEventListener('pointerdown',e=>{sBtn=true;e.preventDefault()});['pointerup','pointercancel','pointerleave'].forEach(n=>sb.addEventListener(n,()=>sBtn=false));
addEventListener('pointerdown',e=>{if(e.target.tagName=='CANVAS'){ptr=e;$('hint').style.display='none'}});
addEventListener('pointermove',e=>{if(ptr&&e.pointerId===ptr.pointerId)ptr=e});const pu=e=>{if(ptr&&e.pointerId===ptr.pointerId)ptr=null};addEventListener('pointerup',pu);addEventListener('pointercancel',pu);

// раскладка облаков уровня: ближе к лавке — лёгкие, дальше — крепкие и дорогие
function spawnCloud(tier,d,a){const g=mesh(CG[tier][(Math.random()*6)|0]),s0=1.2+tier*.3;g.scale.setScalar(s0);g.position.set(Math.cos(a)*d,Math.random()*2.5,Math.sin(a)*d);
 if(Math.hypot(g.position.x-ST.x,g.position.z-ST.z)<13)g.position.x-=30;CL.add(g);
 clouds.push({g,s0,tier,need:tier?TB[tier]*th.needM:Math.min(TB[0]*th.needM,powV()),val:Math.round((4+tier*4)*th.valM),p:0,fly:0,o:g.position.clone(),s:Math.random()*6})}
function newLevel(){while(CL.children.length)CL.remove(CL.children[0]);clouds=[];cargo=[];done=false;P.set(12,0,12);V.set(0,0,0);
 const r=th.R;total=th.total;
 for(let i=0;i<total;i++){const d=13+(i<total*.18?Math.random()*(r*.4-13):Math.sqrt(Math.random())*(r-13)),a=Math.random()*6.283,tier=d<r*.4?0:d<r*.65?1:d<r*.85?2:3;spawnCloud(tier,d,a)}
 ui()}
function ui(){$('cash').textContent='🍬 '+Math.floor(S.cash);$('lvl').textContent='🌍 '+S.lvl+'/'+MAXL+' · облаков '+clouds.length+'/'+total;$('load').textContent='⭐ '+cargo.length+'/'+capV();
 UP.forEach(u=>{const k=u[0],c=cost(u),lv=S[k],cur=u[3]();S[k]++;const nx=u[3]();S[k]--;const nm=u[1].split(' ');u.r.querySelector('.ic').textContent=nm[0];u.r.querySelector('b').textContent=nm.slice(1).join(' ')+' · ур. '+lv;u.r.querySelector('span').textContent=DESC[k];const nf=lv?((lv-1)%10)+1:0;u.r.querySelector('.lv').innerHTML=Array.from({length:10},(_,i)=>'<s'+(i<nf?' class="on"':'')+'></s>').join('');u.r.querySelector('i').textContent=cur+' → '+nx;u.b.textContent='🍬 '+c;u.b.disabled=S.cash<c});const sh=$('scash');if(sh)sh.textContent='🍬 '+Math.floor(S.cash)}
function marker(id,w,em){const e=$(id),v=w.clone();v.y+=4;v.project(cam);let x=v.x,yy=v.y;if(v.z>1){x=-x;yy=-yy}const dist=Math.hypot(w.x-P.x,w.z-P.z),inside=v.z<=1&&Math.abs(x)<.9&&Math.abs(yy)<.78;if(inside&&dist<28){e.style.display='none';return}
 const m=Math.max(Math.abs(x)/.9,Math.abs(yy)/.78,1);x/=m;yy/=m;e.style.display='block';e.style.left=(x+1)/2*innerWidth+'px';e.style.top=(1-yy)/2*innerHeight+'px';e.textContent=em+' '+Math.round(dist)+'м'}
function fl(txt,v){const e=document.createElement('div');e.className='f';e.textContent=txt;document.body.appendChild(e);floats.push({e,v:v.clone(),t:1.1})}
function rescue(){for(let i=0;i<10;i++)spawnCloud(0,13+Math.random()*14,Math.random()*6.283);total+=10;fl('☁️ У базы выросли новые лёгкие облака!',new V3(-3,12,-2));ui()}

// заставка, меню миров, переходы между уровнями
function banner(){$('bn1').textContent='Мир '+S.lvl+' из '+MAXL;$('bn2').textContent=th.name;$('bn3').textContent=th.intro;const b=$('banner');b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}
function buildMenu(){const l=$('mlist');l.innerHTML='';LV.forEach((L,i)=>{const n=i+1,b=document.createElement('button'),lock=!FREE_SELECT&&n>S.max;b.className='wc'+(n==S.lvl?' cur':'');b.style.background=L.card;b.disabled=lock;
  b.innerHTML='<b>'+(lock?'🔒 ':'')+'Мир '+n+' · '+L.name+(n==S.lvl?' (начать заново)':'')+'</b><span>'+L.tag+'</span>';b.onclick=()=>{$('menu').style.display='none';paused=false;go(n,true)};l.appendChild(b)})}
$('menuBtn').onclick=()=>{buildMenu();paused=true;$('menu').style.display='flex'};$('mclose').onclick=()=>{paused=false;$('menu').style.display='none'};
// новый мир: прокачка и конфеты обнуляются (fresh), строится всё окружение
function startLevel(n,fresh){S.lvl=n;S.max=Math.max(S.max,n);if(fresh)resetRun();save();
 floats.forEach(f=>f.e.remove());floats=[];buildWorld();buildSpin();newLevel();stam=100;exh=false;sprint=false;atSt=null;flash=0;lastFl=1;banner();buildMenu()}
function go(n,fresh){if(loading)return;loading=true;const f=$('fade');f.style.opacity=1;setTimeout(()=>{startLevel(n,fresh);f.style.opacity=0;loading=false},380)}
$('ovb').onclick=()=>{$('ov').style.display='none';go(S.lvl<MAXL?S.lvl+1:1,true)};
function finish(){done=true;S.max=Math.max(S.max,Math.min(MAXL,S.lvl+1));save();
 if(S.lvl<MAXL){const nx=LV[S.lvl];$('ovt').textContent='🎉 Мир «'+th.name+'» пройден!';$('ovp').textContent='Дальше — «'+nx.name+'». Прокачка и конфеты сбрасываются: в новом мире начнёшь с нуля.';$('ovb').textContent='В мир «'+nx.name+'» ➜'}
 else{$('ovt').textContent='🏆 Все три мира пройдены!';$('ovp').textContent='Ты собрал все облака — от сахарного заката до грозовой карамели. Можно пройти заново.';$('ovb').textContent='Играть заново ➜'}
 $('ov').style.display='flex'}

// ---------- игровая логика ----------
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;if(!paused&&!loading)step(dt);view(dt);rd.render(sc,cam);requestAnimationFrame(loop)}
function step(dt){
 let dx=0,dz=0;
 if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;if(keys.w||keys.arrowup)dz--;if(keys.s||keys.arrowdown)dz++;
 if(ptr){const px=ptr.clientX-innerWidth/2,py=ptr.clientY-innerHeight*.55,l=Math.hypot(px,py);if(l>14){dx=px/l;dz=py/l}}
 const l=Math.hypot(dx,dz);if(l>1){dx/=l;dz/=l}
 const wantS=(keys.shiftleft||keys.shiftright||keys.space||sBtn)&&Math.hypot(dx,dz)>.1,smax=staV();
 if(wantS&&!exh&&stam>0){sprint=true;stam-=65*dt;if(stam<=0){stam=0;exh=true}}else{sprint=false;stam=Math.min(smax,stam+22*dt);if(exh&&stam>smax*.3)exh=false}
 const sp=spdV()*(1-Math.min(.35,cargo.length*.01))*(sprint?1.8:1);
 V.x+=(dx*sp-V.x)*Math.min(1,dt*5);V.z+=(dz*sp-V.z)*Math.min(1,dt*5);
 P.x+=V.x*dt;P.z+=V.z*dt;const pr=Math.hypot(P.x,P.z),lim=th.R+8;if(pr>lim){P.x*=lim/pr;P.z*=lim/pr}
 if(Math.hypot(V.x,V.z)>1.5){const tt=Math.atan2(-V.z,V.x);let d=tt-heading;d=Math.atan2(Math.sin(d),Math.cos(d));heading+=d*Math.min(1,dt*6)}
 const y=3+Math.sin(t*2)*.35;blimp.position.set(P.x,y,P.z);ship.rotation.y=heading;ship.rotation.z=Math.sin(t*2)*.04;prop.rotation.y=t*18;
 spin.position.set(P.x,y-1.5,P.z);blades.rotation.y=t*8;
 if(sprint){trT-=dt;if(trT<=0){trT=.04;const q=trail.find(p=>p.l<=0);if(q){q.l=.5;q.m.visible=true;q.m.position.set(P.x-Math.cos(heading)*3+Math.random()-.5,y-.3,P.z+Math.sin(heading)*3+Math.random()-.5)}}}
 trail.forEach(q=>{if(q.l>0){q.l-=dt;q.m.scale.setScalar(Math.max(.01,q.l*.7));q.m.rotation.y+=dt*8;if(q.l<=0)q.m.visible=false}});
 stack.position.set(P.x-Math.cos(heading)*2.6-V.x*.05,y-2.2,P.z+Math.sin(heading)*2.6-V.z*.05);stack.rotation.z=Math.sin(t*2)*.05-V.x*.008;stack.rotation.x=V.z*.008;
 const r=radV(),pw=powV(),cap=capV();let inflight=clouds.filter(c=>c.fly).length,bi=0,lockC=null;
 for(let i=clouds.length-1;i>=0;i--){const c=clouds[i],g=c.g;
  if(c.fly){c.fly+=dt*3;g.position.lerp(blimp.position,Math.min(1,c.fly*.6));g.scale.setScalar(Math.max(.05,c.s0*(1-c.fly)));
   if(c.fly>=1){CL.remove(g);clouds.splice(i,1);cargo.push({t:c.tier,v:c.val});ui()}continue}
  const d=Math.hypot(g.position.x-P.x,g.position.z-P.z);
  if(d<r+1.5){
   if(pw<c.need-.001){if(!lockC||d<lockC.d)lockC={c,d};c.p=Math.max(0,c.p-dt*.5)}
   else if(!sprint&&cargo.length+inflight<cap){c.p+=dt*1.2*pw/c.need;
    if(bi<40){bp.set([P.x,y-1.5,P.z,g.position.x,g.position.y,g.position.z],bi*6);bi++}
    if(c.p>=1){c.fly=.01;inflight++}}
  }else c.p=Math.max(0,c.p-dt*.5);
  if(!c.fly){const k=c.p;g.position.x=c.o.x+(P.x-c.o.x)*k*.25+(k?Math.sin(t*40)*.08*k:0);g.position.z=c.o.z+(P.z-c.o.z)*k*.25;g.position.y=c.o.y+Math.sin(t+c.s)*.3;g.scale.setScalar(c.s0*(1-k*.4));g.rotation.y=t*.15+c.s}}
 beamG.setDrawRange(0,bi*2);beamG.attributes.position.needsUpdate=true;
 const lk=$('lock');if(lockC){const v=lockC.c.g.position.clone();v.y+=3;v.project(cam);lk.style.display='block';lk.style.left=(v.x+1)/2*innerWidth+'px';lk.style.top=(1-v.y)/2*innerHeight+'px';lk.textContent='🔒 нужна сила '+lockC.c.need.toFixed(1)+' (у тебя '+pw.toFixed(1)+')'}else lk.style.display='none';
 while(cm.length<cargo.length){const m=mesh(starG,starM[0]);m.scale.setScalar(.45);stack.add(m);cm.push(m)}
 cm.forEach((m,i)=>{m.visible=i<cargo.length;if(m.visible){const f=i/Math.max(cap,1),yy=-1.7+f*2.3,rr=(1.5-Math.abs(yy+.4)*.35)*(.25+.75*((i*.618)%1)),an=i*2.4;m.material=starM[cargo[i].t];m.rotation.set(an,t+i,0);m.position.set(Math.cos(an)*rr,yy+Math.sin(t*3+i)*.04,Math.sin(an)*rr)}});
 if(Math.hypot(P.x,P.z)<10.5&&cargo.length){sellT-=dt;if(sellT<=0){sellT=.07;const it=cargo.pop(),v=Math.round(it.v*valV());S.cash+=v;fl('+'+v,new V3(-3,11,-2));ui();save()}}
 stuckT+=dt;if(stuckT>1.5){stuckT=0;if(clouds.length&&!cargo.length&&!inflight&&S.cash<cost(UP[3])&&!clouds.some(c=>c.fly||powV()>=c.need-.001))rescue()}
 if(!clouds.length&&!cargo.length&&!done)finish();
 {const nr=Math.hypot(P.x-ST.x,P.z-ST.z)<10;if(nr!==atSt){atSt=nr;$('shop').style.display=nr?'flex':'none';$('sprint').style.display=nr?'none':'block'}}
 {const sf=$('stam').firstChild;sf.style.width=Math.max(0,stam/staV()*100)+'%';sf.style.background=exh?'#ff5a5a':'#ffd23f'}
}
// ---------- картинка: камера, небо, погода, декор (работает и на паузе) ----------
function view(dt){
 cam.position.lerp(new V3(P.x,13,P.z+29),Math.min(1,dt*4));cam.lookAt(P.x,0,P.z-8);
 sky.position.copy(cam.position);far.position.set(cam.position.x,0,cam.position.z);if(fx.follow)fx.follow.position.copy(cam.position);
 cam.fov+=((sprint?64:55)-cam.fov)*Math.min(1,dt*6);cam.updateProjectionMatrix();
 gA.rotation.y=t*.6;gB.rotation.y=-t*.9;bc.rotation.y=t*1.5;
 marker('mk0',ORG,'🍭');marker('mk1',ST,'🛠');
 decor.forEach(d=>{d.m.position.y=d.y0+Math.sin(t*.6+d.s)*.8;d.m.rotation.y+=dt*.03});
 confetti.forEach(c=>{c.m.rotation.y+=dt*c.r;c.m.rotation.x+=dt*c.r*.5;c.m.position.y=c.y0+Math.sin(t+c.r*5)*.5});
 fx.update(P,t,dt);
 // вспышка молнии: свет, небо, туман и экран
 flash=Math.max(0,flash-dt*3.2);if(flash>0||lastFl>0){hemi.intensity=th.hemi[2]+flash*1.8;sky.material.color.setScalar(1+flash*.9);sc.fog.color.set(th.fog).lerp(WHITE,flash*.45);$('flash').style.opacity=flash*.2;lastFl=flash}
 floats.forEach(f=>{f.t-=dt;f.v.y+=dt*3;const v=f.v.clone().project(cam);f.e.style.left=(v.x+1)/2*innerWidth+'px';f.e.style.top=(1-v.y)/2*innerHeight+'px';f.e.style.opacity=Math.min(1,f.t*2)});
 floats=floats.filter(f=>{if(f.t<=0)f.e.remove();return f.t>0});
}
{const q=+new URLSearchParams(location.search).get('lvl'),n=(q>=1&&q<=MAXL)?(q|0):S.lvl;startLevel(n,n!==S.lvl)} // ?lvl=2 — открыть нужный мир сразу
cam.position.set(12,13,41);requestAnimationFrame(loop);
})();
</script>
